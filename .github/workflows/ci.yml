name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run unit and integration tests
        run: pytest

  docker-build:
    name: Build container images
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build backend and frontend images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Smoke test the running services
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health; then
              break
            fi
            sleep 5
          done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8080/ > /dev/null
          curl -fsS -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"OverallQual":7,"GrLivArea":1710,"TotalBsmtSF":856,"1stFlrSF":856,"YearBuilt":2003,"GarageCars":2,"FullBath":2,"TotRmsAbvGrd":8,"LotArea":8450,"Neighborhood":"CollgCr"}'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down --remove-orphans
