services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: sys304-house-price-backend
    container_name: sys304-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      CORS_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: sys304-house-price-frontend
    container_name: sys304-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      # The browser calls the API directly, so this must be the host-visible
      # address of the backend, not the compose service name.
      API_URL: "http://localhost:${BACKEND_PORT:-8000}"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
