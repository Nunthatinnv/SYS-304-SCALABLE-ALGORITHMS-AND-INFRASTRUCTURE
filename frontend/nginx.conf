server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets are small and change on every rebuild, so do not cache.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
